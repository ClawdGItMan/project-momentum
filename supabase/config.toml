project_id = "project-momentum"

[api]
enabled = true
port = 54321
schemas = ["public", "app_private", "storage"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "momentum://auth/callback"
additional_redirect_urls = ["momentum://auth/callback", "http://127.0.0.1:3000", "https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Local CLI defaults only. Hosted Supabase auth settings should be configured
# in the dashboard with production-safe confirmation and signup rules.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
